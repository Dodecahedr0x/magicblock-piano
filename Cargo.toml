[workspace]
members = ["program", "clients/rust"]
resolver = "2"

[workspace.dependencies]
borsh = "1.5.7"
codama = "0.7.0"
ephemeral-rollups-sdk = "0.6.6"
litesvm = "0.6.1"
magicblock-piano-client = { path = "clients/rust" }
serde = "1.0.210"
serde_json = "1.0.135"
solana-account-info = "2.2.0"
solana-cpi = "2.2.0"
solana-instruction = "2.2.0"
solana-keypair = "2.2.0"
solana-program = "2.2.0"
solana-program-error = "2.2.0"
solana-pubkey = "2.2.0"
solana-signer = "2.2.0"
solana-system-interface = { version = "1.0.0", features = ["bincode"] }
solana-transaction = "2.2.0"
